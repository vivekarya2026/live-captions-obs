name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon (macos-14 retired Nov 2026); the Intel package is built through Rosetta
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Google sign-in client (from the GOOGLE_OAUTH_CLIENT secret)
        shell: bash
        env:
          CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > app/livecaptions/data/google-docs/oauth_client.json; echo "added"; else echo "::warning::GOOGLE_OAUTH_CLIENT secret not set: Google Docs sign-in is off in this build"; fi
      - name: Rosetta (for the Intel build)
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: CMake (desktop app speech libraries)
        run: command -v cmake || brew install cmake
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Signing certificate (same one every release, so Mac permissions survive updates)
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p ci "$KC" && security set-keychain-settings "$KC" && security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
      - name: Build .pkg
        run: ARCH=${{ matrix.arch }} ./installer/macos/build.sh
      - name: Check the signature
        run: codesign -dv "build/macos-${{ matrix.arch }}/root/Applications/Live Captions.app" 2>&1 | grep "Authority=Live Captions Signing"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Vulkan SDK (desktop app speech libraries, as in Handy's CI)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: SPIRV-Headers (ggml-vulkan needs its CMake package; the SDK above has no config file)
        shell: pwsh
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 https://github.com/KhronosGroup/SPIRV-Headers.git "$env:RUNNER_TEMP\spirv-src"
          cmake -S "$env:RUNNER_TEMP\spirv-src" -B "$env:RUNNER_TEMP\spirv-build" -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP\spirv" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --install "$env:RUNNER_TEMP\spirv-build"
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP\spirv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Google sign-in client (from the GOOGLE_OAUTH_CLIENT secret)
        shell: bash
        env:
          CLIENT: ${{ secrets.GOOGLE_OAUTH_CLIENT }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > app/livecaptions/data/google-docs/oauth_client.json; echo "added"; else echo "::warning::GOOGLE_OAUTH_CLIENT secret not set: Google Docs sign-in is off in this build"; fi
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Build Setup.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **Download for your computer:**
            - Mac (Apple Silicon M1 or newer): `LiveCaptions-…-macOS-arm64.dmg` (or `.pkg`)
            - Mac (Intel processor): `LiveCaptions-…-macOS-x86_64.dmg` (or `.pkg`)
            - Windows 10/11 (64-bit): `LiveCaptions-…-Windows-x64-Setup.exe`

            These installers are not signed by Apple/Microsoft. See the
            [install guide](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
            for the one-time security prompt.
